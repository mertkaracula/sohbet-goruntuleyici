<style>
:root{--bg:#F8F9FA;--bg2:#FFFFFF;--bg3:#F1F3F5;--border:#DEE2E6;--border2:#CED4DA;--text:#212529;--text2:#495057;--text3:#868E96;--on-text:#FFFFFF;--red:#C92A2A}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#111315;--bg2:#1A1D20;--bg3:#24282C;--border:#2E3338;--border2:#3B4148;--text:#E9ECEF;--text2:#C3C9D0;--text3:#8B939B;--on-text:#111315;--red:#F07070}}
:root[data-theme="dark"]{--bg:#111315;--bg2:#1A1D20;--bg3:#24282C;--border:#2E3338;--border2:#3B4148;--text:#E9ECEF;--text2:#C3C9D0;--text3:#8B939B;--on-text:#111315;--red:#F07070}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
#welcome{flex:1;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:linear-gradient(160deg,#2E3134,#0E0F10);overflow:auto}
.wcard{width:100%;max-width:480px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:36px 40px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{display:flex;justify-content:center}
.lg{display:block;width:240px;max-width:100%;height:auto}
.lg-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme]) .lg-l{display:none}:root:not([data-theme]) .lg-d{display:block}}
:root[data-theme="dark"] .lg-l{display:none}
:root[data-theme="dark"] .lg-d{display:block}
.lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);text-align:center;margin:20px 0 0}
.wcard p{color:var(--text2);margin:16px 0 18px;line-height:1.55;font-size:13px;text-align:left}
input{width:100%;padding:10px 12px;font-size:14px;background:var(--bg);border:1px solid var(--border2);border-radius:8px;outline:0;transition:border-color .12s}
input:focus{border-color:var(--text)}
.btn{margin-top:12px;width:100%;padding:10px 12px;font-size:13px;font-weight:500;background:var(--text);color:var(--on-text);border:1px solid var(--text);border-radius:6px;cursor:pointer;transition:opacity .12s}
.btn:hover{opacity:.88}.btn:disabled{opacity:.5;cursor:default}
#err{min-height:16px;margin-top:14px;font-size:12px;color:var(--red);text-align:center}
</style>

var f=document.getElementById('f'),pw=document.getElementById('pw'),b=document.getElementById('b'),er=document.getElementById('err'),wl=document.getElementById('welcome');
function u8(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
function db(){return new Promise(function(ok,no){var r=indexedDB.open('karacula-kilit',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){var d=r.result;d.onversionchange=function(){d.close()};ok(d)};r.onerror=function(){no(r.error)}})}
function kGet(){return db().then(function(d){return new Promise(function(ok){var q=d.transaction('k').objectStore('k').get('anahtar');q.onsuccess=function(){var v=q.result||null;d.close();ok(v)};q.onerror=function(){ok(null)}})}).catch(function(){return null})}
function kSet(k){return db().then(function(d){return new Promise(function(ok){var t=d.transaction('k','readwrite');t.objectStore('k').put(k,'anahtar');t.oncomplete=function(){d.close();ok(true)};t.onerror=function(){ok(false)}})}).catch(function(){return false})}
function kDel(){return db().then(function(d){return new Promise(function(ok){var t=d.transaction('k','readwrite');t.objectStore('k').delete('anahtar');t.oncomplete=function(){d.close();ok()};t.onerror=function(){ok()}})}).catch(function(){})}
async function ac(key){
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(DATA));
  var html=new TextDecoder().decode(pt);
  html=html.replace('<head>','<head><script>window.__KILIT=true<\/script>');
  document.open(); document.write(html); document.close();
}
f.addEventListener('submit',async function(e){
  e.preventDefault(); er.textContent='';
  if(!window.crypto||!crypto.subtle){er.textContent='Bu tarayıcı güvenli bağlantı (HTTPS) olmadan şifre çözemez.';return}
  b.disabled=true; b.textContent='Doğrulanıyor…';
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
    // Anahtar dışa aktarılamaz (extractable=false); yalnızca bu tarayıcıda, şifresiz yeniden açmak için saklanır.
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(DATA));
    pw.value='';
    await kSet(key);
    await ac(key);
  }catch(x){
    er.textContent='Şifre hatalı. Lütfen tekrar deneyin.';
    b.disabled=false; b.textContent='Aç'; pw.select();
  }
});
(async function(){
  wl.style.visibility='hidden';
  try{
    if(window.crypto&&crypto.subtle&&window.indexedDB){
      var k=await kGet();
      if(k){try{await ac(k);return}catch(x){await kDel()}}
    }
  }catch(x){}
  wl.style.visibility='visible'; pw.focus();
})();
})();
</script>
