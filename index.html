<style>
:root{--bg:#F4F5F7;--card:#fff;--tx:#111315;--mu:#6B7280;--bd:#D5D9DE;--ac:#111315;--ac-tx:#fff;--er:#B42318}
@media (prefers-color-scheme:dark){:root{--bg:#0E1012;--card:#16191C;--tx:#E9ECEF;--mu:#8B94A0;--bd:#2D343B;--ac:#E9ECEF;--ac-tx:#111315;--er:#F97066}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,system-ui,"Segoe UI",sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:32px 28px;text-align:center}
.box img{display:block;margin:0 auto 22px;width:150px;height:auto}
@media (prefers-color-scheme:dark){.box img{filter:invert(1) hue-rotate(180deg)}}
h1{font-size:16px;font-weight:600;margin:0 0 6px}
p{font-size:13px;color:var(--mu);margin:0 0 20px;line-height:1.5}
input{width:100%;padding:12px 14px;font:inherit;font-size:15px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx);outline:none}
input:focus{border-color:var(--ac)}
button{margin-top:12px;width:100%;padding:12px;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:var(--ac-tx);cursor:pointer}
button:disabled{opacity:.55;cursor:default}
#err{min-height:20px;margin-top:12px;font-size:13px;color:var(--er)}
</style></head>

f.addEventListener('submit',async function(e){
  e.preventDefault(); er.textContent='';
